name: Python Matrix Build

# Trigger workflow on push to main
on:
  push:
    branches:
      - main

jobs:
  build:
    # Use matrix to run multiple OSes and Python versions
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: [3.9, 3.10, 3.11, 3.12]
      fail-fast: false  # Allows other matrix jobs to run even if one fails

    steps:
      # Step 1: Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Set up the specified Python version
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      # Step 3: Verify Python installation
      - name: Check Python version
        run: python --version

      # Step 4: (Optional) Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Add any additional packages you need here, e.g.,
          # pip install requests

